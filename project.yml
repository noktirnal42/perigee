name: Perigee
options:
  bundleIdPrefix: dev.noktirnal
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  StarlinkKit:
    path: Packages/StarlinkKit
targets:
  Perigee_iOS:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
        excludes: ["Art/**"]   # source masters (icon), not shipped in the bundle
      - path: App/iOS
    dependencies:
      - package: StarlinkKit
        product: StarlinkKit
      - target: PerigeeWidgetsExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.noktirnal.perigee
        PRODUCT_NAME: Perigee
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: Perigee
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Perigee talks to your Starlink router and dish on your local network to show their status and tune their settings."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Perigee uses Face ID to protect your Wi-Fi password before showing it."
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Perigee uses your location only on this device to work out which satellites are overhead. It is never sent anywhere."
        CODE_SIGN_ENTITLEMENTS: App/iOS/Perigee.entitlements
  Perigee_macOS:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
        excludes: ["Art/**"]   # source masters (icon), not shipped in the bundle
      - path: App/macOS
    dependencies:
      - package: StarlinkKit
        product: StarlinkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.noktirnal.perigee
        PRODUCT_NAME: Perigee
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Perigee
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Perigee talks to your Starlink router and dish on your local network to show their status and tune their settings."
        INFOPLIST_KEY_NSLocationUsageDescription: "Perigee uses your location only on this device to work out which satellites are overhead. It is never sent anywhere."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Perigee uses your location only on this device to work out which satellites are overhead. It is never sent anywhere."
        CODE_SIGN_ENTITLEMENTS: App/macOS/Perigee.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_RESOLVED_SWIFTUI_APPEARANCE: NO
  PerigeeWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ["Info.plist", "PerigeeWidgets.entitlements"]
    dependencies:
      - package: StarlinkKit
        product: StarlinkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.noktirnal.perigee.widgets
        PRODUCT_NAME: PerigeeWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/PerigeeWidgets.entitlements
        SKIP_INSTALL: YES
